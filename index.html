<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>The Secure Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Secure Password Generator</h1>
    <div class="options">
      <div class="option-item">
        <input type="checkbox" id="special-characters"> 
        <label for="special-characters">Include Special Characters</label>
      </div>
      <div class="option-item">
        <input type="checkbox" id="numbers">
        <label for="numbers">Include Numbers</label>
      </div>
      <div class="option-item">
        <label for="length">Password Length</label>
        <div class="number-input">
          <button onclick="this.parentNode.querySelector('input[type=number]').stepDown()" class="minus"></button>
          <input type="number" id="length" min="4" max="20" value="8">
          <button onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
        </div>
      </div>
      <button id="generate-btn">Generate Password</button>
    </div>
    <div class="password-container">
      <label for="password">Your Password</label>
      <input type="text" id="password" readonly>
      <button id="copy-btn" onclick="copyPassword()">Copy Password</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
